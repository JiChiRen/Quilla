# Quilla CI
#
# Lean verification for the Quilla secure-boot RTOS platform. Quilla is built on
# the Contiki-NG base; this workflow replaces the upstream Contiki-NG test
# matrix (which exercised Cooja/renode simulations, the RPL/CoAP protocol
# suites, and a Docker toolchain image) with the checks that actually apply to
# this repository:
#
#   firmware-gnu : builds the GNU (arm-none-eabi-gcc) firmware for every
#                  supported Arm MCU (PY32F040xB, GD32F502VE) — QBOOT (CHECK and
#                  the default SEALED secure-boot variant) and QAPP. This is the
#                  only firmware path that can run on public CI; the Keil /
#                  armclang (Cortex-M33 secure-boot) builds require a Keil
#                  license and are verified on a developer machine instead.
#
#   firmware-riscv : EXPERIMENTAL, NON-BLOCKING. Builds the CH32V305 port with
#                  a stock riscv-none-elf toolchain after rewriting the one
#                  WCH-only construct in the sources. This port is bring-up
#                  only: the WPP write-protected NV counter and the WCH
#                  fast-interrupt path are not on-target verified. Its
#                  `continue-on-error` keeps a failure from gating the badge;
#                  the failure stays visible in the job log and in a warning
#                  annotation. See the job's comment for the full boundary.
#
#   host-tools   : runs the Python host-side tooling self-tests — the Ed25519
#                  signing utility and the serial OTA updater shipped to
#                  integrators.
#
# The workflow builds out-of-tree under each MCU's EIDE directory, so a fresh
# checkout never carries stale dependency files.
#
# The CI badge covers the three gating jobs (the Arm firmware builds and the
# host-tools self-test). It is not evidence for the RISC-V port.

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop, release-* ]

# Cancel superseded runs on the same ref; never cancel merge/push runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  firmware-gnu:
    name: Firmware (arm-none-eabi-gcc, ${{ matrix.mcu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcu: [ py32f040xb, gd32f502ve ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GNU Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build QBOOT (CHECK variant)
        run: make -C user/${{ matrix.mcu }}/EIDE -f Makefile.qboot

      - name: Build QBOOT (SEALED variant — default secure-boot mode)
        run: make -C user/${{ matrix.mcu }}/EIDE -f Makefile.qboot.sealed

      - name: Build QAPP
        run: make -C user/${{ matrix.mcu }}/EIDE

  firmware-riscv:
    # EXPERIMENTAL / NON-BLOCKING. CH32V305 is a first bring-up port:
    #   * it builds only with the WCH "RISC-V Embedded GCC12" toolchain, whose
    #     fast-interrupt entry uses a vendor-only attribute mainline GCC rejects;
    #     that toolchain is not redistributable, so CI rewrites the attribute
    #     away and CANNOT validate the WCH fast-interrupt path;
    #   * the WPP write-protected NV counter (anti-rollback carrier) and the
    #     rest of the port are not on-target verified (see
    #     doc/riscv-ch32v305-build.md section 8, "Bring-up items").
    #
    # With a stock riscv-none-elf toolchain this job only catches generic
    # regressions in shared code -- syntax, types, missing symbols, linker-script
    # drift. `continue-on-error` keeps its failures from gating the badge until
    # the bring-up items close out; the failed steps, job log and the warning
    # annotation below remain visible. A green run here is NOT evidence that
    # the RISC-V image boots.
    name: Firmware (RISC-V, CH32V305) [experimental, non-blocking]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Experimental status
        run: |
          echo "::warning title=CH32V305 job is experimental and non-blocking::Bring-up port: WPP write-protected NV counter and WCH fast-interrupt path are not on-target verified. A green build here is not evidence that the RISC-V image boots. Failures of this job do not gate the CI badge."

      - name: Install RISC-V toolchain
        run: |
          set -euo pipefail
          url=https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v13.2.0-2/xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz
          curl -fsSL "$url" -o /tmp/rv.tar.gz
          mkdir -p "$RUNNER_TEMP/rv"
          tar -xzf /tmp/rv.tar.gz -C "$RUNNER_TEMP/rv" --strip-components=1
          echo "$RUNNER_TEMP/rv/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: riscv-none-elf-gcc --version | head -1

      - name: Rewrite the WCH-only interrupt attribute
        run: |
          # __attribute__((interrupt("WCH-Interrupt-fast"))) is a WCH extension;
          # mainline GCC rejects the string outright. Rewrite it to the standard
          # machine-mode form so the stock toolchain can compile the tree.
          # CI-only edit: the shipped image is still built with WCH GCC12.
          files=$(grep -rl 'WCH-Interrupt-fast' arch/cpu/riscv || true)
          if [ -z "$files" ]; then
            echo "error: no WCH-Interrupt-fast attribute found under arch/cpu/riscv." >&2
            echo "       The port no longer needs this rewrite -- delete this step." >&2
            exit 1
          fi
          echo "rewriting:"
          echo "$files" | sed 's/^/  /'
          # shellcheck disable=SC2086
          sed -i 's/interrupt("WCH-Interrupt-fast")/interrupt("machine")/g' $files

      - name: Build QBOOT (CHECK variant)
        run: make -C user/ch32v305rb/EIDE -f Makefile.qboot PREFIX=riscv-none-elf-

      - name: Build QBOOT (SEALED variant)
        run: make -C user/ch32v305rb/EIDE -f Makefile.qboot.sealed PREFIX=riscv-none-elf-

      - name: Build QBOOT (SECURED variant)
        run: make -C user/ch32v305rb/EIDE -f Makefile.qboot.secured PREFIX=riscv-none-elf-

      - name: Build QAPP
        run: make -C user/ch32v305rb/EIDE PREFIX=riscv-none-elf-

  host-tools:
    name: Host tools self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run updater self-test
        run: python tools/quilla_host_updater.py --self-test
