<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="Quilla mark">
  <title>Quilla</title>
  <desc>Quilla mark: the U-shaped hull cross-section, cut by a waterline, with a bilge keel on each side and a keel node at the bottom centre — the node is the signature-verification gate.</desc>
  <defs>
    <linearGradient id="qm" x1="26" y1="92" x2="102" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset=".55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <g transform="scale(4)">
    <g stroke="url(#qm)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 30 C26 66 44 90 64 94 C84 90 102 66 104 30" stroke-width="6"/>
      <path d="M18 58 H110" stroke-width="2.4" opacity=".32"/>
      <path d="M35 83 L27 93" stroke-width="3"/>
      <path d="M93 83 L101 93" stroke-width="3"/>
    </g>
    <circle cx="64" cy="94" r="4.6" fill="url(#qm)"/>
  </g>
</svg>
